Section "ServerLayout"
    Identifier "GPT Toolbox NVIDIA Desktop"
    Screen 0 "NvidiaScreen"
EndSection

Section "Device"
    Identifier "NvidiaDevice"
    Driver "nvidia"
    BusID "PCI:3:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier "NvidiaScreen"
    Device "NvidiaDevice"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
