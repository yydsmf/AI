<html lang="zh-CN">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT 工具箱</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #18191c; font: 16px/1.5 system-ui, sans-serif; letter-spacing: 0; }
    main { width: min(440px, calc(100% - 32px)); }
    h1 { margin: 0 0 28px; font-size: 30px; font-weight: 650; text-align: center; letter-spacing: 0; }
    nav { display: grid; gap: 12px; }
    a { display: block; padding: 16px 20px; border: 1px solid #c9ccd1; border-radius: 6px; background: #fff; color: #18191c; text-align: center; text-decoration: none; font-weight: 600; }
    a:hover { border-color: #25734f; color: #185e3d; }
  </style>
</head>
<body>
  <main>
    <h1>GPT 工具箱</h1>
    <nav>
      <a href="/admin/vnc.html?autoconnect=1&resize=scale&path=admin/websockify">管理员工作台</a>

</html>
