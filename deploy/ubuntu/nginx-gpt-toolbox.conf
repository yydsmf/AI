server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/gpttoolbox.crt;
    ssl_certificate_key /etc/nginx/ssl/gpttoolbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/gpt-toolbox;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /admin/ {
        auth_basic "GPT Toolbox";
        auth_basic_user_file /etc/nginx/gpt-admin.htpasswd;
        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /user2/ {
        auth_basic "GPT Toolbox";
        auth_basic_user_file /etc/nginx/gpt-user2.htpasswd;
        proxy_pass http://127.0.0.1:6082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
